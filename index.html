<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
  <title>Yakıt Nabzı</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #DCD3B8; font-family: -apple-system, sans-serif; }
    #root { min-height: 100%; }
    #durum { padding: 24px; font-size: 14px; color: #4a4436; }
    #hata-kutusu {
      display: none; position: fixed; inset: 0; background: #1a1a1a; color: #ff6b6b;
      font-family: monospace; font-size: 13px; padding: 16px; overflow: auto; z-index: 9999;
      white-space: pre-wrap; word-break: break-word;
    }
  </style>
</head>
<body>
  <div id="root"><div id="durum">Yükleniyor... (sürüm 9)</div></div>
  <div id="hata-kutusu"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script>
    function hataGoster(baslik, detay) {
      var kutu = document.getElementById("hata-kutusu");
      kutu.style.display = "block";
      kutu.textContent = baslik + "\n\n" + detay;
    }
    window.hataGoster = hataGoster;

    window.addEventListener("unhandledrejection", function (e) {
      var sebep = e.reason;
      var mesaj = (sebep && sebep.message) || String(sebep);
      var yigin = (sebep && sebep.stack) || "";
      hataGoster("YAKALANMAMIŞ PROMISE HATASI (sayfa açıldıktan sonra):", mesaj + "\n\n" + yigin);
    });

    var durumEl = document.getElementById("durum");

    if (typeof React === "undefined" || typeof ReactDOM === "undefined" || typeof Babel === "undefined") {
      hataGoster("KÜTÜPHANE YÜKLENEMEDİ:", "React, ReactDOM veya Babel CDN'den yüklenemedi. İnternet bağlantısını veya unpkg.com erişimini kontrol edin.");
    } else {
      if (durumEl) durumEl.textContent = "Kütüphaneler yüklendi, app.tsx çekiliyor... (sürüm 9)";

      fetch("app.tsx?nocache=" + Date.now())
        .then(function (res) {
          if (!res.ok) throw new Error("app.tsx getirilemedi, HTTP " + res.status);
          return res.text();
        })
        .then(function (kaynakKod) {
          if (durumEl) durumEl.textContent = "app.tsx çekildi (" + kaynakKod.length + " karakter), derleniyor...";
          var derlenmis;
          try {
            derlenmis = Babel.transform(kaynakKod, {
              presets: [["react", { runtime: "classic" }]],
              filename: "app.tsx",
            }).code;
          } catch (derlemeHatasi) {
            hataGoster("BABEL DERLEME HATASI:", derlemeHatasi.message);
            return;
          }
          if (durumEl) durumEl.textContent = "Derlendi, çalıştırılıyor...";
          try {
            (0, eval)(derlenmis);
          } catch (calismaHatasi) {
            var isim = (calismaHatasi && calismaHatasi.name) || "Hata";
            var mesaj = (calismaHatasi && calismaHatasi.message) || String(calismaHatasi);
            var yigin = (calismaHatasi && calismaHatasi.stack) || "";
            hataGoster("ÇALIŞMA ZAMANI HATASI:", isim + ": " + mesaj + "\n\n" + yigin);
          }
        })
        .catch(function (agHatasi) {
          hataGoster("DOSYA ÇEKME HATASI:", agHatasi.message);
        });
    }
  </script>
</body>
</html>
