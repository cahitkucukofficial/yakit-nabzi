name: Fiyatları Güncelle

on:
  schedule:
    - cron: "10 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fiyatları çek ve dosyayı güncelle
        env:
          UCUZYAKITBUL_API_KEY: ${{ secrets.UCUZYAKITBUL_API_KEY }}
        run: node scripts/update-fiyatlar.js

      - name: Değişiklik varsa commit'le ve gönder
        run: |
          git config user.name "fiyat-botu"
          git config user.email "actions@github.com"
          git add fiyatlar.json
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "Günlük fiyat güncellemesi"
            git push
          fi
