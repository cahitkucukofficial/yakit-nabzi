name: Fiyatları Güncelle

on:
  schedule:
    # Her gün 00:10 Türkiye saati (UTC+3) = 21:10 UTC (bir önceki gün)
    - cron: "10 21 * * *"
  workflow_dispatch: {} # Settings > Actions > Run workflow ile elle de tetiklenebilir

permissions:
  contents: write

jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fiyatları çek ve dosyayı güncelle
        env:
          UCUZYAKITBUL_API_KEY: ${{ secrets.UCUZYAKITBUL_API_KEY }}
        run: node scripts/update-fiyatlar.js

      - name: Haberleri çek ve dosyayı güncelle
        run: node scripts/fetch-haberler.js

      - name: Değişiklik varsa commit'le ve gönder
        run: |
          git config user.name "fiyat-botu"
          git config user.email "actions@github.com"
          git add fiyatlar.json haberler.json
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "Günlük fiyat ve haber güncellemesi"
            git push
          fi
