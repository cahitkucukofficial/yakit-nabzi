name: Haberleri Güncelle

on:
  schedule:
    - cron: "0 */4 * * *"   # günde 6 kez (UTC saatine göre)
  workflow_dispatch: {}       # Actions sekmesinden elle çalıştırmaya izin ver

permissions:
  contents: write            # bot'un commit/push yapabilmesi için gerekli

jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu çek
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Bağımlılığı kur
        run: npm install rss-parser

      - name: Haberleri çek
        run: node scripts/fetch-haberler.js

      - name: Değişiklik varsa commit'le ve push'la
        run: |
          git config user.name "haber-botu"
          git config user.email "haber-botu@users.noreply.github.com"
          git add haberler.json
          git diff --cached --quiet || git commit -m "Haber güncellemesi"
          git pull --rebase origin main
          git push
