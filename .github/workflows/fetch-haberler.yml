name: Haberleri Güncelle

on:
  schedule:
    - cron: "0 */4 * * *"   # günde 6 kez (UTC saatine göre)
  workflow_dispatch: {}       # Actions sekmesinden elle çalıştırmaya izin ver

jobs:
  guncelle:
    runs-on: ubuntu-latest
    permissions:
      contents: write         # commit/push yapabilmesi için gerekli
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Bağımlılıkları kur
        working-directory: yakit-nabzi
        run: npm install

      - name: Haberleri çek
        working-directory: yakit-nabzi
        run: node scripts/fetch-haberler.js

      - name: Değişiklik varsa commit'le ve push'la
        working-directory: yakit-nabzi
        run: |
          git config user.name "haber-bot"
          git config user.email "haber-bot@users.noreply.github.com"
          git add haberler.json
          git diff --cached --quiet || git commit -m "haberler.json güncellendi"
          git push
