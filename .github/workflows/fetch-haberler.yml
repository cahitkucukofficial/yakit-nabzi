name: Haberleri Güncelle

on:
  schedule:
    - cron: "30 */3 * * *"   # 3 saatte bir, :30'da (fiyat isiyle cakismasin)
  workflow_dispatch: {}       # Actions sekmesinden elle çalıştırmaya izin ver

permissions:
  contents: write            # bot'un commit/push yapabilmesi için gerekli

# Aynı anda iki çalışma (zamanlayıcı + zincir) çakışıp push'ta hata vermesin: sırayla çalışsınlar
concurrency:
  group: haber-guncelle
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 10        # takılırsa 10 dakikada kendiliğinden iptal olsun
    steps:
      - name: Repoyu çek
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Bağımlılığı kur
        run: npm install rss-parser

      - name: Haberleri çek
        run: node scripts/fetch-haberler.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Değişiklik varsa commit'le ve push'la
        run: |
          git config user.name "haber-botu"
          git config user.email "haber-botu@users.noreply.github.com"
          git add haberler.json
          git diff --cached --quiet || git commit -m "Haber güncellemesi"
          git pull --rebase origin main
          git push
