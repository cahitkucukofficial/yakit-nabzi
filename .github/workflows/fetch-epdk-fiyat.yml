name: EPDK Fiyatlarini Guncelle

on:
  schedule:
    - cron: "0 */4 * * *"   # gunde 6 kez
  workflow_dispatch: {}       # Actions sekmesinden elle calistirmaya izin ver

permissions:
  contents: write
  issues: write   # veri 12+ saattir guncellenmiyorsa otomatik Issue acabilmek icin

jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu cek
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Bagimliliklari kur
        run: npm install puppeteer@23 xlsx

      - name: EPDK'dan fiyatlari cek
        run: node scripts/fetch-epdk-fiyat.js

      - name: Hata ayiklama ekran goruntulerini yukle (varsa)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epdk-debug-goruntuleri
          path: debug-*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Degisiklik varsa commit'le ve gonder
        run: |
          git config user.name "epdk-fiyat-botu"
          git config user.email "epdk-fiyat-botu@users.noreply.github.com"
          # rm -f DEGIL git rm kullaniyoruz: debug-*.png ister repo'da hala
          # TAKIP EDILIYOR olsun (eski durum), ister zaten .gitignore'da olsun
          # (yeni durum) - her iki durumda da hatasiz calisir. rm -f + sadece
          # "git add fiyatlar.json" yapmak, dosyalar hala takip ediliyorsa
          # "unstaged deletion" birakip bir sonraki `git pull --rebase`'i
          # kirar (bu committe tam bunu yasadik).
          git rm -f --ignore-unmatch debug-*.png >/dev/null 2>&1 || true
          git add fiyatlar.json
          git diff --cached --quiet || git commit -m "EPDK fiyat guncellemesi"
          git pull --rebase origin main
          git push

      - name: Veri tazeligini kontrol et, gerekirse uyari Issue'su ac
        # always(): script yukarida throw etse ("ne petrol ne LPG cekilebildi")
        # bile bu adim calissin - asil yakalamak istedigimiz durum bu zaten.
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const ESIK_SAAT = 12;

            let guncelleme;
            try {
              const veri = JSON.parse(fs.readFileSync("fiyatlar.json", "utf-8"));
              guncelleme = new Date(veri.guncelleme);
              if (isNaN(guncelleme.getTime())) throw new Error("guncelleme alani gecersiz tarih");
            } catch (e) {
              core.warning("fiyatlar.json okunamadi/parse edilemedi, tazelik kontrolu atlaniyor: " + e.message);
              return;
            }

            const farkSaat = (Date.now() - guncelleme.getTime()) / 3600000;
            core.info("Son basarili guncelleme: " + guncelleme.toISOString() + " (" + farkSaat.toFixed(1) + " saat once)");
            if (farkSaat < ESIK_SAAT) {
              core.info("Veri taze (" + ESIK_SAAT + " saat esiginin altinda), Issue acilmiyor.");
              return;
            }

            const baslik = "\u26a0\ufe0f EPDK verisi " + ESIK_SAAT + "+ saattir guncellenmiyor";
            const { data: acikIssuelar } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "epdk-veri-uyarisi",
            });
            if (acikIssuelar.some((i) => i.title === baslik)) {
              core.info("Ayni basliga sahip acik bir Issue zaten var, tekrar acilmiyor.");
              return;
            }

            const runUrl = context.serverUrl + "/" + context.repo.owner + "/" + context.repo.repo + "/actions/runs/" + context.runId;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: baslik,
              labels: ["epdk-veri-uyarisi"],
              body:
                "`fiyatlar.json` son **" + farkSaat.toFixed(1) + " saattir** guncellenmedi " +
                "(son basarili guncelleme: " + guncelleme.toISOString() + ").\n\n" +
                "Bu genellikle EPDK sitesindeki bir degisiklik (form/tablo selector'lari kirilmis olabilir) " +
                "ya da surekli bir erisim sorunu anlamina gelir. Bu calistirmanin loglarina ve " +
                "\"epdk-debug-goruntuleri\" artifact'indeki ekran goruntulerine bakin:\n\n" + runUrl + "\n\n" +
                "Sorun cozulup veri tekrar akmaya basladiginda bu Issue'yu manuel kapatabilirsin " +
                "(otomatik kapanmiyor).",
            });
            core.info("Uyari Issue'su acildi.");
